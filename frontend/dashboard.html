<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Quản Lý Log SQL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="report.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <h1>
            <span>📊</span> Dashboard Quản Lý Log SQL
        </h1>
        <div id="userInfo"></div>
    </header>

    <!-- Tab Navigation -->
    <ul class="nav-tabs">
        <li>
            <a href="#log-analysis" class="active">
                <i class="fas fa-file-alt"></i>
                Phân tích Log
            </a>
        </li>
        <li>
            <a href="#database-list">
                <i class="fas fa-database"></i>
                Danh sách Database
            </a>
        </li>
        <li>
            <a href="#abnormal-queries">
                <i class="fas fa-exclamation-triangle"></i>
                Truy vấn Bất thường
            </a>
        </li>
        <li>
            <a href="#reports">
                <i class="fas fa-file-export"></i>
                Báo cáo & Xuất file
            </a>
        </li>
        <li>
            <a href="#optimization">
                <i class="fas fa-lightbulb"></i>
                Gợi ý Tối ưu
            </a>
        </li>
    </ul>

    <!-- Tab Contents -->
    <!-- Log Analysis Tab -->
    <div id="log-analysis" class="tab-content active">
        <div class="full-card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-file-alt"></i>
                    Phân tích file log SQL
                </h2>
            </div>
            <input type="file" id="logFile" class="file-input">
            <button class="primary" onclick="uploadLogFile()">
                <i class="fas fa-upload"></i>
                Phân tích
            </button>
            <div id="logResult"></div>
        </div>
    </div>

    <!-- Database List Tab -->
    <div id="database-list" class="tab-content">
        <div class="full-card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-database"></i>
                    Danh sách Database
                </h2>
            </div>
            <select id="dbDropdown" onchange="fetchQueries()"></select>
            <div id="queries"></div>
        </div>
    </div>

    <!-- Abnormal Queries Tab -->
    <div id="abnormal-queries" class="tab-content">
        <div class="full-card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-exclamation-triangle"></i>
                    Quét truy vấn bất thường
                </h2>
                <div class="card-actions">
                    <button class="danger" onclick="scanAbnormalQueries()">
                        <i class="fas fa-search"></i>
                        Quét
                    </button>
                </div>
            </div>
            <div id="abnormalResult"></div>
        </div>
    </div>

    <!-- Reports Tab -->
    <div id="reports" class="tab-content">
        <div class="full-card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-file-export"></i>
                    Báo cáo & Xuất file
                </h2>
                <div class="card-actions">
                    <button id="autoRefreshBtn" class="primary" onclick="toggleAutoRefresh()" title="Tự động cập nhật mỗi 5 phút">
                        <i class="fas fa-clock"></i>
                        Tự động cập nhật
                    </button>
                    <button class="success" onclick="fetchReportSummary()">
                        <i class="fas fa-sync"></i>
                        Tạo Báo Cáo
                    </button>
                    <button class="primary" onclick="downloadCSV()">
                        <i class="fas fa-file-csv"></i>
                        Tải CSV
                    </button>
                    <button class="primary" onclick="downloadPDF()">
                        <i class="fas fa-file-pdf"></i>
                        Tải PDF
                    </button>
                </div>
            </div>
            <div id="reportSummary" class="report-content"></div>
        </div>
    </div>

    <!-- Optimization Tab -->
    <div id="optimization" class="tab-content">
        <div class="full-card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-lightbulb"></i>
                    Gợi ý Tối ưu Hóa Truy Vấn
                </h2>
                <div class="card-actions">
                    <button class="primary" onclick="fetchOptimizationSuggestions()">
                        <i class="fas fa-search"></i>
                        Xem Gợi Ý
                    </button>
                </div>
            </div>
            <div id="optimizationSuggestions"></div>
        </div>
    </div>

    <script>
        // Tab Navigation
        document.addEventListener('DOMContentLoaded', function() {
            const tabs = document.querySelectorAll('.nav-tabs a');
            const tabContents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    // Remove active class from all tabs and contents
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    // Add active class to clicked tab
                    tab.classList.add('active');
                    
                    // Show corresponding content
                    const contentId = tab.getAttribute('href').substring(1);
                    document.getElementById(contentId).classList.add('active');
                });
            });
        });
    </script>
    <script src="script.js"></script>
    <script src="report.js"></script>
</body>
</html>
